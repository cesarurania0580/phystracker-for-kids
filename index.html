      document.querySelectorAll('[data-field="height"]').forEach(input=>input.max=state.scale);
      $('[data-notice]')?.remove();$('#scale-error')?.remove();
      if(state.scale<Math.max(...intervals().map(r=>roundSig2(r.v))))e.target.closest('label').insertAdjacentHTML('afterend',`<div id="scale-error" class="notice error">${t('scaleError')}</div>`);
    }
    // Inputs update in place: replacing the screen on blur used to swallow the next click.
  });
  $('#app').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action;
    if(action==='demo'){state.rows=[{t:'0',x:'0'},{t:'1.1',x:'3'},{t:'2',x:'7'},{t:'2.8',x:'11'},{t:'3.5',x:'15'},{t:'4.1',x:'20'},{t:'4.7',x:'25'},{t:'5.3',x:'30'}];resetWork();state.message='';render();}
    else if(action==='add'&&state.rows.length<10){state.rows.push({t:'',x:''});state.message='';render();}
    else if(action==='remove'&&state.rows.length>6){state.rows.splice(Number(button.dataset.index),1);resetWork();state.message='';render();}
    else if(action==='calc'){const err=validate();if(err)setMessage(err);else{state.stage=1;state.message='';render();}}
    else if(action==='back'){state.stage=0;state.message='';render();}
    else if(action==='hint'){const i=Number(button.dataset.index);state.hints[i]=!state.hints[i];render();}
    else if(action==='check-row'){state.calcChecked[Number(button.dataset.index)]=true;const done=intervals().every((r,i)=>state.calcChecked[i]&&isCorrect(state.answers[i],r.v));if(done)setMessage('calcGood','success');else{state.message='';render();}}
    else if(action==='check-calc'){const v=intervals();state.calcChecked=v.map(()=>true);const missing=v.some((_,i)=>state.answers[i]===''||state.answers[i]==null);const good=v.every((r,i)=>isCorrect(state.answers[i],r.v));setMessage(good?'calcGood':missing?'calcMissing':'calcTry',good?'success':'error');}
    else if(action==='graph'){state.stage=2;state.scale??=Math.max(1,Math.ceil(Math.max(...intervals().map(r=>roundSig2(r.v)))));state.message='';render();}
    else if(action==='explain'){state.stage=3;state.message='';render();}
    else if(action==='back-graph'){state.stage=2;render();}
    else if(action==='feedback'){requestFeedback();}
    else if(action==='revise'){$('#explanation').focus();$('#explanation').scrollIntoView({behavior:'smooth',block:'center'});}
    else if(action==='back-calc'){state.stage=1;state.message='';render();}
    else if(action==='check-bar'){state.barChecked[Number(button.dataset.index)]=true;if(graphComplete())setMessage('graphGood','success');else{state.message='';render();}}
    else if(action==='check-graph'){state.barChecked=intervals().map(()=>true);const good=graphComplete();setMessage(good?'graphGood':'graphTry',good?'success':'error');}
    else if(action==='print')window.print();
    else if(action==='restart'){state.stage=0;state.rows=Array.from({length:8},()=>({t:'',x:''}));resetWork();state.message='';render();}
    if(action==='check-row'){const i=Number(button.dataset.index);encourage(isCorrect(state.answers[i],intervals()[i].v));}
    else if(action==='check-calc'||action==='check-graph')encourage(state.kind==='success');
    else if(action==='check-bar'){const i=Number(button.dataset.index),v=intervals()[i].v,good=barCorrect(state.heights[i],v),empty=state.heights[i]==null||state.heights[i]==='';encourage(good,good?'':t(empty?'placeBar':Number(state.heights[i])<roundSig2(v)?'higher':'lower'));}
    else hideToast();
  });
  render();
})();
</script>
</body>
</html>
